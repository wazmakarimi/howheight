<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Brand Mark Icon -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
    <!-- Height comparison mark -->
    <line x1="12" y1="52" x2="52" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="22" y1="52" x2="22" y2="16" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="22" y1="26" x2="30" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="22" y1="38" x2="28" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="52" x2="42" y2="28" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <line x1="36" y1="38" x2="42" y2="38" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Brand Name -->
  <text x="165" y="128" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    How<tspan fill="#3b82f6">Height</tspan>
  </text>
  <text x="165" y="152" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    HOWHEIGHT.ORG
  </text>

  <!-- Headline & Tagline -->
  <text x="80" y="270" font-family="'Inter', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2">
    Compare Anything by Height
  </text>
  <text x="80" y="325" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Interactive visual comparison for people, celebrities, animals, objects, anime and more.
  </text>

  <!-- Visual Measurement Scene: Baseline & Figures -->
  <g transform="translate(740, 220)">
    <!-- Vertical Ruler -->
    <line x1="40" y1="320" x2="40" y2="30" stroke="#475569" stroke-width="2" />
    <line x1="30" y1="30" x2="40" y2="30" stroke="#3b82f6" stroke-width="3" />
    <text x="5" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">210 cm</text>

    <line x1="32" y1="100" x2="40" y2="100" stroke="#3b82f6" stroke-width="2" />
    <text x="5" y="105" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">180 cm</text>

    <line x1="32" y1="160" x2="40" y2="160" stroke="#3b82f6" stroke-width="2" />
    <text x="5" y="165" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">160 cm</text>

    <!-- Floor Baseline -->
    <line x1="20" y1="320" x2="420" y2="320" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Figure 1: Door / Structure (210cm) -->
    <rect x="70" y="30" width="80" height="290" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="110" y="180" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">210 cm</text>

    <!-- Figure 2: Tall Human (180cm) -->
    <g transform="translate(180, 100)">
      <circle cx="25" cy="20" r="16" fill="#3b82f6" />
      <path d="M12 45 C12 40, 38 40, 38 45 L42 140 L30 140 L30 220 L20 220 L20 140 L8 140 Z" fill="#3b82f6" />
      <text x="25" y="-12" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#93c5fd" text-anchor="middle">180 cm</text>
    </g>

    <!-- Figure 3: Human (160cm) -->
    <g transform="translate(260, 160)">
      <circle cx="22" cy="18" r="14" fill="#a855f7" />
      <path d="M10 40 C10 36, 34 36, 34 40 L38 100 L28 100 L28 160 L18 160 L18 100 L6 100 Z" fill="#a855f7" />
      <text x="22" y="-12" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#d8b4fe" text-anchor="middle">160 cm</text>
    </g>

    <!-- Figure 4: Quadruped Animal / Dog (60cm) -->
    <g transform="translate(340, 260)">
      <rect x="0" y="20" width="55" height="40" rx="8" fill="#f59e0b" />
      <rect x="40" y="8" width="18" height="25" rx="6" fill="#f59e0b" />
      <line x1="10" y1="60" x2="10" y2="60" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
      <line x1="45" y1="60" x2="45" y2="60" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
      <text x="27" y="10" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#fde68a" text-anchor="middle">60 cm</text>
    </g>
  </g>

  <!-- Category Badges Pill Strip -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="560" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="280" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      People • Celebrities • Anime • Films • Animals • Objects • Plants • Sports
    </text>
  </g>

  <!-- URL Bottom Bar -->
  <text x="80" y="550" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#3b82f6" letter-spacing="1">
    howheight.org
  </text>
  <text x="240" y="550" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#64748b">
    | Free, fast, static-first visual measurement platform
  </text>
</svg>
